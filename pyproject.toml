[project]
name = "multiagent-family-task-organizer"
version = "0.1.0"
description = "FastAPI scaffold for local-LLM chat sessions using Pydantic AI."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-ai>=0.7.0",
    "python-dotenv>=1.0.1",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
# Only `app` is a Python package; `frontends/` holds web UIs, not Python.
# Without this, setuptools flat-layout auto-discovery errors on multiple
# top-level dirs.
packages = ["app"]

[tool.uvicorn]
factory = false
